<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaru ❤️</title>

<style>
body{
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
font-family:Arial,sans-serif;
overflow:hidden;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.2);
text-align:center;
animation:fade 2s;
}

h1{
color:#ff3366;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff3366;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff1744;
}

#msg{
display:none;
margin-top:20px;
font-size:20px;
color:#d81b60;
}

@keyframes fade{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}
</style>
</head>

<body>

<div class="card">
<h1>❤️ Aaru ❤️</h1>

<p>Ek chhota sa surprise...</p>

<button onclick="showLove()">Click Here</button>

<div id="msg">
<h2>Tu majhya ayushyatli sarvat sundar gosht ahes. ❤️</h2>

<p>I Love You Forever 💖</p>
</div>
</div>

<script>
function showLove(){
document.getElementById("msg").style.display="block";
}
</script>

</body>
  </html>
